function help(){return page('💡 說明','<h3>🔍 找飯店</h3><p>輸入城市（中英文都可以）→ 點入住、退房日期 → 馬上看結果。上方可以改人數、預算、排序。</p><h3>🏆 推薦分數怎麼算</h3><p>推薦分數 =（加權評分 − 6）² × 交通便利係數 × 10000 ÷ √每晚價格。</p><ul><li><b>加權評分</b>：依評論數調整，評論越少越往 8.0 靠（評論數 ÷（評論數＋150）的比重用飯店自己的分數），避免只有幾十則評論的高分飯店排第一。評分都是 10 分制（Google 的 5 分制會 ×2）。</li><li><b>交通便利係數</b>：出國多半沒開車，所以看最近的火車／地鐵站步行距離：300 m 內 ×1.15、500 m 內 ×1.10、800 m 內 ×1.0、1.2 km 內 ×0.88、更遠 ×0.78；查不到 ×0.95。離市中心 3 km 內再 +0.05，超過 12 km −0.05。</li><li><b>價格</b>：用平方根，便宜有加分，但不會讓評價差的便宜飯店排到最前面。</li></ul><p>想只看離車站最近的，按「🚇 交通便利」排序。</p><h3>💰 關於價錢</h3><p>每晚含稅參考價（新台幣），來源和查詢時間標在結果上方。主要來源是 Trip.com，抓不到時會自動改用備援來源，再不行會顯示暫存資料，並清楚標示。實際價格以訂房網站為準。</p><h3>🔔 降價通知</h3><p>在結果頁按「存下這個查詢」，並在「降價通知」打開系統通知。每天 09:00 重查，降價 5% 以上就會通知你。</p><h3>🧳 我訂購的飯店</h3><p>加入訂好的飯店（可以貼上確認信自動帶入），會顯示倒數、入住退房時間、設施、地圖，入住前一天和退房當天早上提醒你。</p><h3>💾 備份（選用）</h3><p>不用登入。在「我的住宿」按「匯出備份」，會下載一個檔案，裡面有你的住宿和存下的查詢。換手機時按「匯入備份」，已經有的不會重複加進來。沒有備份也不影響找飯店、通知和我的住宿。</p><h3>📱 加到主畫面</h3><p>iPhone：Safari「分享」→「加入主畫面」。Android：Chrome「⋮」→「安裝應用程式」。</p>');}
